services:
  - type: web
    name: heritage-translator-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGO_URI
        sync: false   # set this manually in Render's dashboard (your Atlas connection string)
